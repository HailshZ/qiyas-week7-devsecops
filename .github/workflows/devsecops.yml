name: DevSecOps Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Job 1: SAST with Semgrep (using custom rules)
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/custom-rules.yml

  # Job 2: Conditional Push to Local Registry (only if Semgrep passes)
  push:
    runs-on: ubuntu-latest
    needs: [semgrep]
    if: success()
    steps:
      - name: Security gates passed - Push allowed
        run: |
          echo "✅ All security gates passed!"
          echo "🚀 Image would be pushed to registry: 192.168.56.50:5000/juice-shop:latest"
          echo "📦 In production, this would deploy the container"
          echo "🔒 Security checks: Semgrep SAST ✅"

