name: DevSecOps Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Job 1: SAST with Semgrep
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/custom-rules.yml

  # Job 2: Container scanning with Trivy
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t juice-shop:latest .
      - name: Run Trivy vulnerability scanner (fail on CRITICAL)
        run: trivy image --severity CRITICAL --exit-code 1 juice-shop:latest
